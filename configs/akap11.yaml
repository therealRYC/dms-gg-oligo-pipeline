# Created: 2026-03-01
# Last updated: 2026-03-05 — Fix barcodes_per_variant to 10 (default)

# AKAP11 — NM_016248, 1902 codons (5706 nt)
# Minimal config; inherits defaults from config_template.yaml

gene_fasta: "data/AKAP11_NM_016248_CDS.fasta"
gene_name: "AKAP11"
output_dir: "Example Genes/AKAP11"

# PolIII promoter (U6 with internal T7)
polIII_promoter: "GAGGGCCTATTTCCCATGATTCCTTCATATTTGCATATACGATACAAGGCTGTTAGAGAGATAATTAGAATTAATTTGACTGTAAACACAAAGATATTAGTACAAAATACGTGACGTAGAAAGTAATAATTTCTTGGGTAGTTTGCAGTTTTTAATACGACTCACTATAGGGACTATCATATGCTTACCGTAACTTGAAAGTATTTCGATTTCTTGGCTTTATATATCTTGTGGAAAGGACGAAACACCG"

# Intergene elements (WPRE + spacer + bGH polyA)
# Order: Gene 3' end → WPRE → spacer → bGH polyA → [PolIII promoter]
# Downstream cassette: WPRE(589) + spacer(31) + bGH_polyA(225) + PolIII(250) = ~1,095 bp
intergene_elements:
  - name: "WPRE"
    sequence: ""
    # 589 nt — WPRE from pTK4-GFP (Addgene). Enhances mRNA stability, reduces PolII readthrough.
  - name: "spacer"
    sequence: "ATCGATACCGAGCGCTGGTCGACAGATCTAC"
    # 31 nt — Spacer between WPRE and polyA (consistent with pTK4 and XPRESSO designs)
  - name: "bGH_polyA"
    sequence: "CTGTGCCTTCTAGTTGCCAGCCATCTGTTGTTTGCCCCTCCCCCGTGCCTTCCTTGACCCTGGAAGGTGCCACTCCCACTGTCCTTTCCTAATAAAATGAGGAAATTGCATCGCATTGTCTGAGTAGGTGTCATTCTATTCTGGGGGGTGGGGTGGGGCAGGACAGCAAGGGGGAGGATTGGGAAGACAATAGCAGGCATGCTGGGGATGCGGTGGGCTCTATGG"
    # 225 nt — bGH polyA signal from pcDNA3.1 (Thermo Fisher). GenBank J00008.1, EF550208.1, U55762.1.
    # No BsmBI or PaqCI sites. Verified against Goodwin & Rottman 1992 JBC 267:16330.

# 5' gene junction — MUST match your helper plasmid's BsaI overhang.
# Replace "NNNN" with the actual overhang from your plasmid.
oh_L: "auto"
# upstream_cassette: "CC"                    # Sequence between oh_L and ATG (e.g., Kozak tail)

# PaqCI overhangs — MUST match your destination vector's PaqCI sites.
# These are arbitrary placeholders; replace with your actual vector overhangs.
paqci_star2: "auto"
paqci_star1: "auto"

barcodes_per_variant: 10

simulate_assembly: true

# --- Advanced / OOGGA Boundary Optimization (defaults are fine for most genes) ---
# overlap_codons: 6                        # Codons of overlap between adjacent tiles (must be even, >= 2)
# search_window_K: 15                      # Codon search window around ideal tile boundaries
# oogga_max_identity: 2                    # Max positional identity between overhang pairs (collision threshold)
# oogga_beam_width: 10                     # Beam search width for SB boundary DP
# boundary_method: "oogga_two_pass"        # Boundary optimization method (only supported method)
# multi_k_search: true                     # Try multiple tile counts for best overhang quality
# dp_k_range: 5                            # Search K_ideal +/- this many tile counts
# min_geneblock_length: 300                # Minimum gene block length (nt)
# max_oligo_length: 300                    # Twist oligo pool max (nt)
# max_geneblock_length: 1800               # Gene fragment synthesis max (nt)
# geneblock_flanking_pad: "TGCATG"         # Flanking bases beyond enzyme sites on gene blocks
# verbose_timing: false                    # Print per-step timing to console
