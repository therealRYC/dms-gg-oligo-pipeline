# Created: 2026-03-02
# Last updated: 2026-03-05 — Fix barcodes_per_variant to 10 (default)

# GRIN2A with long cassette — test case for cassette splitting (BUG-004)
# Downstream cassette: P2A-EGFP(786) + WPRE(589) + spacer(31) + bGH_polyA(225) + PolIII(250)
#                    = 1881 nt total (exceeds 1778 nt cassette block synthesis limit → triggers splitting)
#
# P2A-EGFP source:
#   P2A-GSG: porcine teschovirus-1 2A peptide with GSG linker (Kim et al. 2011)
#   EGFP: enhanced GFP from pEGFP-N1 (GenBank U55762, CDS 679-1398)
#
# NOTE: P2A-EGFP is placed as an intergene element AFTER the gene's stop codon.
# This is a test case for cassette splitting, not a functional in-frame fusion.
# NOTE: P2A contains one BsmBI site (reverse, at nt 40) — pipeline warns but continues.

gene_fasta: "data/GRIN2A_NM_000833_CDS.fasta"
gene_name: "GRIN2A_long_cassette"
output_dir: "output/grin2a_long_cassette"

# PolIII promoter (U6 with internal T7)
polIII_promoter: "GAGGGCCTATTTCCCATGATTCCTTCATATTTGCATATACGATACAAGGCTGTTAGAGAGATAATTAGAATTAATTTGACTGTAAACACAAAGATATTAGTACAAAATACGTGACGTAGAAAGTAATAATTTCTTGGGTAGTTTGCAGTTTTTAATACGACTCACTATAGGGACTATCATATGCTTACCGTAACTTGAAAGTATTTCGATTTCTTGGCTTTATATATCTTGTGGAAAGGACGAAACACCG"

# Intergene elements — long cassette for split testing
# Order: Gene → P2A-EGFP → WPRE → spacer → bGH_polyA → PolIII → Barcode
intergene_elements:
  - name: "P2A_EGFP"
    sequence: ""
    # 786 nt — GSG-P2A (Kim 2011) + EGFP (pEGFP-N1, GenBank U55762)
    # NOTE: P2A contains one BsmBI site (reverse, at nt 40) — pipeline warns but continues.
  - name: "WPRE"
    sequence: ""
    # 589 nt — WPRE from pTK4-GFP (Addgene). Enhances mRNA stability, reduces PolII readthrough.
  - name: "spacer"
    sequence: "ATCGATACCGAGCGCTGGTCGACAGATCTAC"
    # 31 nt — Spacer between WPRE and polyA (consistent with pTK4 and XPRESSO designs)
  - name: "bGH_polyA"
    sequence: "CTGTGCCTTCTAGTTGCCAGCCATCTGTTGTTTGCCCCTCCCCCGTGCCTTCCTTGACCCTGGAAGGTGCCACTCCCACTGTCCTTTCCTAATAAAATGAGGAAATTGCATCGCATTGTCTGAGTAGGTGTCATTCTATTCTGGGGGGTGGGGTGGGGCAGGACAGCAAGGGGGAGGATTGGGAAGACAATAGCAGGCATGCTGGGGATGCGGTGGGCTCTATGG"
    # 225 nt — bGH polyA signal from pcDNA3.1 (Thermo Fisher). GenBank J00008.1, EF550208.1, U55762.1.
    # No BsmBI or PaqCI sites. Verified against Goodwin & Rottman 1992 JBC 267:16330.

# PaqCI overhangs — MUST match your destination vector's PaqCI sites.
# These are arbitrary placeholders; replace with your actual vector overhangs.
paqci_star2: "AATG"
paqci_star1: "GCTA"

barcodes_per_variant: 10
