# Created: 2026-03-01
# Last updated: 2026-03-03 — Use bGH polyA; clarify PaqCI overhangs are placeholders

# TRIO — NM_007118, 3098 codons (9294 nt)
# Minimal config; inherits defaults from config_template.yaml

gene_fasta: "data/TRIO_NM_007118_CDS.fasta"
gene_name: "TRIO"
output_dir: "output/trio"

# PolIII promoter (U6 with internal T7)
polIII_promoter: "GAGGGCCTATTTCCCATGATTCCTTCATATTTGCATATACGATACAAGGCTGTTAGAGAGATAATTAGAATTAATTTGACTGTAAACACAAAGATATTAGTACAAAATACGTGACGTAGAAAGTAATAATTTCTTGGGTAGTTTGCAGTTTTTAATACGACTCACTATAGGGACTATCATATGCTTACCGTAACTTGAAAGTATTTCGATTTCTTGGCTTTATATATCTTGTGGAAAGGACGAAACACCG"

# Intergene elements (WPRE + spacer + bGH polyA)
# Order: Gene 3' end → WPRE → spacer → bGH polyA → [PolIII promoter]
# Downstream cassette: WPRE(589) + spacer(31) + bGH_polyA(225) + PolIII(250) = ~1,095 bp
intergene_elements:
  - name: "WPRE"
    sequence: ""
    # 589 nt — WPRE from pTK4-GFP (Addgene). Enhances mRNA stability, reduces PolII readthrough.
  - name: "spacer"
    sequence: "ATCGATACCGAGCGCTGGTCGACAGATCTAC"
    # 31 nt — Spacer between WPRE and polyA (consistent with pTK4 and XPRESSO designs)
  - name: "bGH_polyA"
    sequence: "CTGTGCCTTCTAGTTGCCAGCCATCTGTTGTTTGCCCCTCCCCCGTGCCTTCCTTGACCCTGGAAGGTGCCACTCCCACTGTCCTTTCCTAATAAAATGAGGAAATTGCATCGCATTGTCTGAGTAGGTGTCATTCTATTCTGGGGGGTGGGGTGGGGCAGGACAGCAAGGGGGAGGATTGGGAAGACAATAGCAGGCATGCTGGGGATGCGGTGGGCTCTATGG"
    # 225 nt — bGH polyA signal from pcDNA3.1 (Thermo Fisher). GenBank J00008.1, EF550208.1, U55762.1.
    # No BsmBI or PaqCI sites. Verified against Goodwin & Rottman 1992 JBC 267:16330.

# PaqCI overhangs — MUST match your destination vector's PaqCI sites.
# These are arbitrary placeholders; replace with your actual vector overhangs.
paqci_star2: "AATG"
paqci_star1: "GCTA"

# Fast validation run (1 barcode per variant)
barcodes_per_variant: 1
