# DMS Golden Gate Oligo Pipeline — Configuration Template
# Copy this file to your project directory and edit as needed.

# --- Gene Input (one of gene_fasta or gene_cds is required) ---
gene_fasta: "path/to/gene.fasta"          # Path to FASTA file with coding sequence
# gene_cds: "ATGGCT...TAA"               # Alternative: CDS string directly (ACGT only, divisible by 3)

# --- Gene Name (optional) ---
# gene_name: "GRIN2A"                     # Short name for output files. If omitted, auto-extracted
                                           # from the first token of the FASTA header.

# --- PolIII Promoter ---
# Sequence of the PolIII promoter (e.g., U6 with internal T7) placed between
# the gene and barcode. This drives barcode transcription.
polIII_promoter: "GAGGGCCTATTTCCCATGATTCCTTCATATTTGCATATACGATACAAGGCTGTTAGAGAGATAATTAGAATTAATTTGACTGTAAACACAAAGATATTAGTACAAAATACGTGACGTAGAAAGTAATAATTTCTTGGGTAGTTTGCAGTTTTTAATACGACTCACTATAGGGACTATCATATGCTTACCGTAACTTGAAAGTATTTCGATTTCTTGGCTTTATATATCTTGTGGAAAGGACGAAACACCG"

# --- Intergene Elements ---
# Sequence elements placed between the gene 3' end and the PolIII promoter.
# Default: WPRE + spacer + bGH polyA (from pcDNA3.1 / pTK4-derived designs).
#
# Each element has a name and a sequence. Elements are concatenated in order
# and placed between the gene and PolIII promoter in the BsmBI gene blocks.
# If the combined cassette exceeds the gene block synthesis limit (1800 nt),
# superblock splitting handles it automatically.
#
# Final construct layout:
#   [Gene] — [WPRE] — [spacer] — [bGH_polyA] — [PolIII] — [Barcode]
#
# To run WITHOUT intergene elements (PolIII directly after gene), comment out
# or delete the intergene_elements section below.
#
# NOTE: For very long cassettes (>~1700 nt total including PolIII), the pipeline
# automatically splits the cassette across multiple gene block fragments using
# additional BsmBI junctions. No user action required.
intergene_elements:
  - name: "WPRE"
    sequence: ""
    # 589 nt — WPRE from pTK4-GFP (Addgene). WHV post-transcriptional regulatory element.
  - name: "spacer"
    sequence: "ATCGATACCGAGCGCTGGTCGACAGATCTAC"
    # 31 nt — Spacer between WPRE and polyA, from pTK4-GFP.
  - name: "bGH_polyA"
    sequence: "CTGTGCCTTCTAGTTGCCAGCCATCTGTTGTTTGCCCCTCCCCCGTGCCTTCCTTGACCCTGGAAGGTGCCACTCCCACTGTCCTTTCCTAATAAAATGAGGAAATTGCATCGCATTGTCTGAGTAGGTGTCATTCTATTCTGGGGGGTGGGGTGGGGCAGGACAGCAAGGGGGAGGATTGGGAAGACAATAGCAGGCATGCTGGGGATGCGGTGGGCTCTATGG"
    # 225 nt — bGH polyA signal from pcDNA3.1 (Thermo Fisher). GenBank J00008.1, EF550208.1.
    # No BsmBI, BsaI, or PaqCI sites. Verified against Goodwin & Rottman 1992 JBC 267:16330.

# --- 5' Gene Junction (default: auto-selected) ---
# oh_L: 4-nt BsaI overhang at the 5' gene junction. This overhang sits
# UPSTREAM of the start codon (ATG) in the helper plasmid, so the assembled
# product is: ...oh_L + upstream_cassette + ATG + [gene CDS] + ...
#
# When "auto", the pipeline co-selects oh_L and oh4 as a pair optimized for
# BsaI set fidelity (set_fidelity == 1.0 preferred). IMPORTANT: record the
# auto-selected value — your helper plasmid must be built to match.
#
# NOTE: CACC (the obvious Kozak overhang) collides with oh3 derived from
# the U6 promoter ending ...CACCG. Choose based on your plasmid design.
oh_L: "auto"                                # 4-nt BsaI overhang or "auto"

# upstream_cassette: DNA sequence between oh_L and the ATG start codon.
# Typically a partial Kozak sequence (e.g., "CC" for a ...CACC-oh_L-CC-ATG
# context). Leave empty ("") if oh_L directly abuts ATG.
# upstream_cassette: "CC"
upstream_cassette: ""

# --- Codon Usage Table (optional) ---
# By default, the pipeline uses the built-in CoCoPUTs human codon usage table
# (Alexaki et al. 2019, 119K CDS, GRCh38.p13). To use a custom table, provide
# a path to a .csv or .rds file with columns: codon, aa, frequency
# (64 rows, one per codon, frequencies per thousand).
# codon_table_path: "path/to/custom_codon_usage.csv"

# --- Oligo Synthesis ---
max_oligo_length: 300                      # Twist oligo pool max (nt)
max_geneblock_length: 1800                 # Gene fragment synthesis max (nt)
# min_geneblock_length: 300                # Minimum gene block length (nt) to avoid synthesis issues.
                                           # Blocks shorter than this trigger a warning.
geneblock_flanking_pad: "TGCATG"           # Flanking bases beyond enzyme sites on gene blocks.
                                           # NEB recommends ≥6 bp for efficient Type IIs cleavage
                                           # at linear fragment termini. Set to "" to disable.

# --- PCR Handles (optional) ---
# Per-tile PCR primer handles for selective amplification from a pooled oligo order.
# When ordering multiple tiles in a single oligo pool, each tile gets a unique
# fwd/rev handle pair flanking the oligo. These sit OUTSIDE the BsaI sites:
#
#   5'—[fwd_handle]—BsaI_fwd—oh1—[mutable]—...—BsaI_rev_oh4—[rev_handle]—3'
#
# Handles are stripped during BsaI digestion and serve only for PCR amplification.
# Provide a path to a CSV file with 'fwd' and 'rev' columns — one row per tile,
# in tile order. All fwd handles must be the same length; all rev handles must
# be the same length (fwd_len may differ from rev_len). Minimum 15 nt per handle.
#
# Example CSV (pcr_handles.csv):
#   fwd,rev
#   ACGTACGTACGTACGTACGT,TGCATGCATGCATGCATGCA
#   GCTAGCTAGCTAGCTAGCTA,ATCGATCGATCGATCGATCG
#
# To order primers:
#   Forward primer = fwd handle sequence (as written)
#   Reverse primer = reverse complement of rev handle (output in pcr_primer_table.csv)
#
# If omitted, no handles are added (backward compatible — use when ordering
# one pool per tile). Provide more rows than expected tiles; extras are ignored.
#
# IMPORTANT: Handles eat into the 300 nt oligo budget. Adding 20+20 = 40 nt of
# handles reduces the mutable region by ~40 nt (~13 codons), resulting in more tiles.
#
# pcr_handles: "path/to/pcr_handles.csv"

# --- Barcode Design ---
# Unified hierarchical prefix-suffix mode:
#   barcode = prefix(p nt) + suffix(L-p nt)
#   - One unique prefix per variant with hard Hamming distance guarantee
#   - Random filtered suffixes for replicate barcodes (no pairwise constraint)
#   - Cross-variant pairs: d(full) >= d(prefix) >= min_hamming
#   - Within-variant pairs: d(full) = d(suffix) = random (same variant, OK)

barcode_length: 20                         # Total barcode length (nt). Range: 6-30, or "auto" to
                                           # auto-calculate minimum length for the variant count.

min_hamming_distance: 3                    # Minimum Hamming distance between variant prefixes.
                                           # For sequencing: 3 allows single-error correction + detection.
                                           # Auto-reduced (with warning) if prefix capacity is tight.

barcode_prefix_length: 12                  # Prefix length — the Hamming-constrained region. First p
                                           # nucleotides carry the hard distance guarantee. Critical for
                                           # optical pooled screening where accuracy degrades with cycles.
                                           # Must be >= min_hamming_distance and < barcode_length
                                           # (unless barcodes_per_variant == 1).

barcode_gc_range: [0.35, 0.65]             # Acceptable GC content range for barcodes.
                                           # Tightened from [0.25, 0.75] — captures most Tm
                                           # benefit with ~15% additional rejection.
barcode_max_homopolymer: 4                 # Max homopolymer run in barcodes.
barcodes_per_variant: 10                   # Number of unique barcodes per variant. Default 10.
                                           # Increase for higher-confidence fitness estimates, or
                                           # set to 1 for single-barcode-per-variant designs.

# --- Enhanced Barcode Filters ---
# Literature-motivated filters that are only possible with programmed barcodes.
# Each filter has a boolean toggle and a threshold parameter.
# Conservative defaults: low-rejection filters ON, high-rejection OFF.
# Estimated yield with defaults: ~38% pass rate (~100K usable prefixes at k=12).

barcode_filter_ggc: false                  # Reject barcodes containing GGC trinucleotide.
                                           # Illumina error hotspot: 16% of substitution errors
                                           # linked to GG motifs (Schirmer et al. 2016).
                                           # ~25% rejection. Enable for Illumina-heavy workflows.

barcode_filter_hairpin: true               # Reject barcodes with self-complementary hairpin stems.
                                           # Hairpins reduce PCR efficiency 40-90% and impair
                                           # padlock probe hybridization. ~10-15% rejection.
barcode_max_hairpin_stem: 3                # Max hairpin stem length (bp) before rejection.
                                           # Stems > 3 bp rejected (i.e., 4+ bp stems filtered).

barcode_filter_dinuc_repeats: true         # Reject barcodes with excessive dinucleotide repeats
                                           # (e.g., ACACAC). Cause indel errors via polymerase
                                           # slippage during sequencing. ~2% rejection.
barcode_max_dinuc_repeat_units: 4          # Max repeat units allowed. 4 = ACACACAC OK,
                                           # 5 = ACACACACAC rejected.

barcode_filter_polyg: false                # Strict poly-G filter. G homopolymers have the highest
                                           # error rate on Illumina two-channel chemistry and cause
                                           # T7 polymerase slippage. ~6% rejection.
                                           # Note: general homopolymer filter already catches runs > 4.
barcode_max_polyg: 2                       # Max consecutive G's when filter is enabled.
                                           # 2 = GGG rejected, GG OK.

barcode_filter_tm_uniformity: false        # Post-hoc filter: keep barcodes within +/- tm_tolerance
                                           # of the set median Tm. Ensures consistent padlock probe
                                           # ligation efficiency. ~10-20% rejection. Applied after
                                           # all other filters (needs full set to compute median).
barcode_tm_tolerance: 2.0                  # Tm tolerance in degrees C. Barcodes outside
                                           # median +/- this value are replaced.

# --- Tile Boundary Optimization ---
boundary_method: "oogga_two_pass"             # OOGGA two-pass: collision-aware SB + tile DP (only supported method).
multi_k_search: true                         # Try multiple tile counts to find the tiling with best
                                             # average overhang quality. Default true.
dp_k_range: 5                                # Search K_ideal +/- dp_k_range tile counts (default 5).
                                             # Larger values explore more options but take longer.
                                             # Search stops early when avg score gain < 0.5%.
overlap_codons: 6                            # Number of codons of overlap between adjacent tiles at
                                             # boundaries (must be even, >= 2). Variants in the overlap
                                             # zone appear in both tiles but are only mutable in one.
# search_window_K: 15                        # Codon search window around ideal tile boundaries for
                                             # overhang quality optimization. Larger = more options,
                                             # slower. Rarely needs changing.
# oogga_max_identity: 2                      # Max positional identity (out of 4) between overhang pairs
                                             # before collision rejection. Lower = stricter filtering.
# oogga_beam_width: 10                       # Beam search width for SB boundary DP. Higher = more
                                             # exploration at the cost of speed.

# --- Fixed Overhangs for 3-Enzyme Assembly ---
# oh3: 4-nt BsmBI overhang at PolIII-barcode junction (same for all tiles).
#   Derived from the PolIII promoter's 3' end by default.
# oh4: 4-nt BsaI overhang at barcode-helper plasmid junction (same for all tiles).
#   Auto-selected as a pair with oh_L for optimal BsaI set fidelity.
# oh3: "NNNN"
# oh4: "auto"

# --- PaqCI Overhangs (default: auto-selected) ---
# These 4-nt overhangs are set by the PaqCI sites flanking the cloning site in
# your backbone. When "auto", the pipeline picks non-colliding overhangs.
# IMPORTANT: record the auto-selected values — your destination vector must match.
# To use specific overhangs from your vector, replace "auto" with the 4-nt sequence.
paqci_star2: "auto"                        # PaqCI** overhang (5' end of insert) or "auto"
paqci_star1: "auto"                        # PaqCI* overhang (3' end of insert) or "auto"

# --- Variant Controls ---
# WT controls are ALWAYS included (one per mutable position, identical codon to
# wild-type with a unique barcode). These serve as normalization controls.
# Synonymous controls use the highest-frequency alternative codon for the same AA.
# Met and Trp positions have no synonymous variant (only one codon each).
include_synonymous: false                  # Add synonymous codon controls (default: off)

# --- Enzyme Site Domestication ---
auto_domesticate: true                     # Automatically apply silent mutations to remove sites

# --- Assembly Simulation ---
simulate_assembly: true                    # Run in-silico GG assembly simulation after design.
                                           # Verifies that oligos + gene blocks assemble correctly
                                           # by simulating BsaI and BsmBI digestion + ligation.
                                           # STRONGLY RECOMMENDED to leave enabled — catches overhang
                                           # collisions, missing blocks, and assembly errors.
simulation_samples_per_tile: 1             # Number of randomly sampled variants per tile to simulate.
                                           # Higher values increase coverage but take longer.

# --- Output ---
output_dir: "output"                       # Directory for output files

# --- Advanced / Debug ---
# verbose_timing: false                    # Print per-step timing information to console.
                                           # Useful for profiling large genes. Default: off.
